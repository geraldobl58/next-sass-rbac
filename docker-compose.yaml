version: "3.8"

services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: next-sass-rbac
    environment:
      POSTGRES_DB: next-sass-rbac
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
